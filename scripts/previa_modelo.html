<title>Prévia do EULER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Prévia do app EULER: barra lateral fixa + área de leitura de até 1100px, como o app. */
:root {
  color-scheme: dark;
  --fundo: #212121;
  --lateral: #171717;
  --cartao: #262626;
  --campo: #2A2A2A;
  --linha: #363636;
  --texto: #ECECEC;
  --suave: #A3A3A3;
  --fraco: #7C7C7C;
  --ref: #2A3646; --ref-texto: #C7D5EA; --ref-borda: #3E4E66;
  --comp: #45321F; --comp-texto: #F2C08F; --comp-borda: #6A4A2C;
  --serie: #3987E5;
  --s-blue: #1F2A3A; --t-blue: #A8C7FA;
  --s-orange: #3A2A1E; --t-orange: #F6AD6B;
  --s-gray: #2E2E2E; --t-gray: #BDBDBD;
  --s-red: #3B2323; --t-red: #F28B82;
  --s-green: #1E3328; --t-green: #7BD8A6;
  --s-violet: #2D2740; --t-violet: #C3B5FD;
  --s-yellow: #3A3220; --t-yellow: #F2C94C;
  --fonte: "Source Sans 3", "Source Sans Pro", "Segoe UI", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--fundo); color: var(--texto); }
body { font-family: var(--fonte); font-size: 16px; line-height: 1.55; }
button, select { font-family: inherit; }
.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.lateral { background: var(--lateral); padding: 22px 16px; position: sticky; top: 0;
  height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.logo { display: flex; align-items: center; gap: 10px; color: var(--texto); padding: 0 8px; }
.logo span { font-size: 19px; font-weight: 500; letter-spacing: .24em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav h6 { margin: 14px 8px 4px; font-size: 13px; font-weight: 500; color: var(--suave); }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 7px; color: var(--texto); font-size: 14.5px; }
.nav button:hover { background: #222222; }
.nav button[aria-current="page"] { background: #2B2B2B; font-weight: 600; }
.nav button:focus-visible, .botao:focus-visible, .chip:focus-visible, .aba:focus-visible,
.celula:focus-visible, select:focus-visible { outline: 2px solid #A8C7FA; outline-offset: 2px; }
.nav svg { width: 17px; height: 17px; flex: none; color: var(--suave); }
.abas-secao { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-bottom: -6px; }
.abas-secao button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 7px;
  padding: 5px 10px; border-radius: 7px; color: var(--suave); font-size: 14px; }
.abas-secao button:hover { background: #222222; color: var(--texto); }
.abas-secao button[aria-current="page"] { background: #2B2B2B; color: var(--texto); font-weight: 600; }
.abas-secao button:focus-visible { outline: 2px solid #A8C7FA; outline-offset: 2px; }
.abas-secao svg { width: 15px; height: 15px; flex: none; }
.lateral .rodape-lateral { margin-top: auto; font-size: 13px; color: var(--fraco);
  border-top: 1px solid #262626; padding: 14px 8px 0; }
.principal { min-width: 0; padding-inline: 32px; padding-block: 26px 40px; }
.conteudo { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.faixa-previa { font-size: 13.5px; color: var(--suave); border: 1px dashed #3A3A3A;
  border-radius: 8px; padding: 8px 12px; }
.faixa-previa b { color: var(--texto); font-weight: 600; }

/* Cabeçalho das telas */
.cabecalho { border-bottom: 1px solid var(--linha); padding-bottom: 14px; display: grid; gap: 4px; }
.sobrelinha { text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 600;
  color: var(--fraco); }
h1 { font-size: 34px; font-weight: 650; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-size: 23px; font-weight: 600; margin: 8px 0 0; text-wrap: balance; }
h3 { font-size: 18px; font-weight: 600; margin: 4px 0 0; }
.resumo { color: var(--suave); margin: 0; max-width: 62rem; font-size: 16.5px; }
.dados-em-uso { font-size: 14px; color: var(--suave); display: flex; flex-wrap: wrap;
  gap: 8px; align-items: center; }
.dados-em-uso b { color: var(--texto); font-weight: 600; }
.secao { text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 600;
  color: var(--fraco); margin-top: 6px; }
p { margin: 0; }
.legenda { color: var(--suave); font-size: 14px; }

/* Peças */
.cartao { background: var(--cartao); border: 1px solid var(--linha); border-radius: 10px;
  padding: 16px 18px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.grade { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.metrica .rotulo { color: var(--suave); font-size: 14px; font-weight: 500; }
.metrica .valor { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums;
  line-height: 1.2; }
.delta { display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px;
  background: var(--s-gray); color: var(--t-gray); border-radius: 999px; padding: 1px 9px;
  width: fit-content; }
.selo { display: inline-block; border-radius: 6px; padding: 0 7px; font-size: 13.5px;
  font-weight: 500; line-height: 1.6; white-space: nowrap; }
.s-blue { background: var(--s-blue); color: var(--t-blue); }
.s-orange { background: var(--s-orange); color: var(--t-orange); }
.s-gray { background: var(--s-gray); color: var(--t-gray); }
.s-red { background: var(--s-red); color: var(--t-red); }
.s-green { background: var(--s-green); color: var(--t-green); }
.s-violet { background: var(--s-violet); color: var(--t-violet); }
.s-yellow { background: var(--s-yellow); color: var(--t-yellow); }
.alerta { border-radius: 10px; padding: 14px 16px; display: grid;
  grid-template-columns: 20px minmax(0, 1fr); gap: 10px; align-items: start; }
.alerta svg { width: 19px; height: 19px; margin-top: 2px; }
.alerta.aviso { background: var(--s-yellow); color: var(--t-yellow); }
.alerta.info { background: var(--s-blue); color: var(--t-blue); }
.alerta.ok { background: var(--s-green); color: var(--t-green); }
.alerta b { font-weight: 700; }
.botao { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid #4A4A4A; border-radius: 7px; padding: 7px 14px; font-size: 15px;
  color: var(--texto); background: transparent; }
.botao:hover { border-color: #8A8A8A; }
.botao.primario { background: #ECECEC; color: #171717; border-color: #ECECEC; font-weight: 600; }
.botao.primario:hover { background: #FFFFFF; }
.botao[disabled] { opacity: .45; cursor: not-allowed; }
.botao svg { width: 17px; height: 17px; }
.linha-botoes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.proximo { display: flex; justify-content: flex-end; }
.chip { all: unset; cursor: pointer; border: 1px solid #3F3F3F; border-radius: 999px;
  padding: 3px 12px; font-size: 14px; color: var(--suave); }
.chip[aria-pressed="true"] { border-color: #ECECEC; color: var(--texto); background: #2E2E2E; }
ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
details { border: 1px solid var(--linha); border-radius: 8px; padding: 9px 14px; }
details summary { cursor: pointer; font-size: 15px; }
details[open] summary { margin-bottom: 8px; }
.tabela-rolagem { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th { text-align: left; font-weight: 500; color: var(--suave); padding: 8px 8px;
  border-bottom: 1px solid var(--linha); vertical-align: bottom; }
td { padding: 7px 8px; border-bottom: 1px solid #2E2E2E; vertical-align: top;
  font-variant-numeric: tabular-nums; }
td.num, th.num { text-align: right; }
/* colunas curtas sem quebra; a última (motivo, aviso, frase) quebra o texto */
td { white-space: nowrap; }
td:last-child { white-space: normal; }

/* Início */
.abertura { background: radial-gradient(120% 140% at 0% 0%, rgba(168, 199, 250, .07), rgba(168, 199, 250, 0) 55%), var(--lateral);
  border: 1px solid #2C2C2C; border-radius: 14px; padding: 36px 40px 32px; display: grid; gap: 10px; }
.abertura .marca-grande { font-size: 46px; font-weight: 500; letter-spacing: .2em; color: #FFFFFF;
  line-height: 1.1; }
.abertura .frase { font-size: 21px; font-weight: 500; }
.abertura p { color: var(--suave); font-size: 17px; max-width: 50rem; }
.passo { justify-content: space-between; }
.passo .titulo { font-weight: 600; display: flex; gap: 8px; align-items: center; }

/* Investigação */
.tempo { display: flex; gap: 4px; }
.celula { all: unset; cursor: pointer; flex: 1; text-align: center; font-size: 13px; padding: 7px 0;
  border-radius: 5px; background: var(--campo); color: var(--fraco); border: 1px solid #333333;
  font-variant-numeric: tabular-nums; }
.celula.ref { background: var(--ref); color: var(--ref-texto); border-color: var(--ref-borda); font-weight: 600; cursor: default; }
.celula.comp { background: var(--comp); color: var(--comp-texto); border-color: var(--comp-borda); font-weight: 600; }
.legenda-tempo { display: flex; flex-wrap: wrap; gap: 20px; font-size: 14.5px; color: var(--suave); }
.legenda-tempo b { color: var(--texto); font-weight: 600; }
.q { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.q.ref { background: var(--ref); border: 1px solid var(--ref-borda); }
.q.comp { background: var(--comp); border: 1px solid var(--comp-borda); }
.controles { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: end; }
.controle { display: grid; gap: 4px; font-size: 14px; color: var(--suave); }
.controle .linha { display: flex; gap: 8px; align-items: center; color: var(--texto); }
select { background: var(--campo); color: var(--texto); border: 1px solid #3F3F3F; border-radius: 7px;
  padding: 6px 10px; font-size: 15px; }
.atalhos { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.abas { display: flex; gap: 22px; border-bottom: 1px solid var(--linha); overflow-x: auto; }
.aba { all: unset; cursor: pointer; padding: 8px 0 9px; font-size: 15px; color: var(--suave);
  border-bottom: 2px solid transparent; white-space: nowrap; }
.aba[aria-selected="true"] { color: var(--texto); border-bottom-color: #ECECEC; }
.hipotese { display: grid; gap: 6px; }
.hipotese .titulo { font-weight: 600; }
.grafico { position: relative; }
.grafico svg { width: 100%; height: auto; display: block; }
.grafico text { font-family: var(--fonte); }
.dica { position: fixed; pointer-events: none; background: #0F0F0F; color: var(--texto);
  border: 1px solid #3A3A3A; border-radius: 6px; padding: 5px 9px; font-size: 13px; z-index: 10;
  white-space: nowrap; }
.barras { display: grid; gap: 8px; }
.barra { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: center;
  font-size: 13.5px; color: var(--suave); }
.barra .trilho { display: flex; align-items: center; gap: 8px; min-width: 0; }
.barra .cheia { height: 22px; border-radius: 0 4px 4px 0; }
.relatorio-quadro { width: 100%; height: 1400px; border: 0; border-radius: 6px; background: #FFFFFF; }
.rodape { border-top: 1px solid var(--linha); padding-top: 16px; color: var(--fraco); font-size: 13.5px; }

/* Formulários e acompanhamento */
.form { display: grid; gap: 12px; border: 1px solid var(--linha); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.campo { display: grid; gap: 5px; font-size: 14px; color: var(--suave); min-width: 0; }
.campo input, .campo textarea, .campo select, .nome-lateral input { width: 100%; background: var(--campo); color: var(--texto);
  border: 1px solid #3F3F3F; border-radius: 7px; padding: 7px 10px; font: inherit; font-size: 15px; }
.campo select[disabled] { opacity: .85; }
.campo textarea { min-height: 76px; resize: vertical; }
.campo input:focus-visible, .campo textarea:focus-visible, .nome-lateral input:focus-visible { outline: 2px solid #A8C7FA; outline-offset: 1px; }
.nome-lateral { display: grid; gap: 6px; font-size: 13.5px; color: var(--suave); padding: 0 8px; }
.nome-lateral[hidden] { display: none; }
.alerta.erro { background: var(--s-red); color: var(--t-red); }
.cartao.fin-total { background: linear-gradient(130deg, #283944, #20272c); border-color: #45545f; }
.cartao.fin-alerta { background: linear-gradient(130deg, #3b3023, #292725); border-color: #705431; }
.cartao.fin-alerta .valor { color: #ffd39b; }
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 20; background: var(--s-green); color: var(--t-green);
  border: 1px solid #2F5A43; border-radius: 10px; padding: 10px 14px; font-size: 14.5px;
  max-width: min(420px, calc(100vw - 40px)); box-shadow: 0 6px 24px rgba(0, 0, 0, .35); }
.lado-a-lado { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
/* percurso da planta (D102), quadro da conclusão (D101) e entrega do fechamento (D104) */
.passos { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin: 4px 0; }
.passo b { display: block; margin: 8px 0 2px; }
.quadro h3 { margin: 0; }
ol.verificar { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.entrega h4 { margin: 8px 0 0; font-size: 16px; font-weight: 600; }
.conteudo hr { border: 0; border-top: 1px solid var(--linha); margin: 10px 0; }
.link { all: unset; cursor: pointer; color: var(--t-blue); display: inline-flex; gap: 6px; align-items: center; font-size: 15px; }
.link:hover { text-decoration: underline; }
.link:focus-visible { outline: 2px solid #A8C7FA; outline-offset: 2px; }
.link svg { width: 16px; height: 16px; }
.titulo-uso { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.quebra td { white-space: normal; min-width: 8rem; }

@media (max-width: 1180px) { .g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 960px) {
  .g5, .g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .passos { grid-template-columns: minmax(0, 1fr); }
  .app { grid-template-columns: minmax(0, 1fr); }
  .lateral { position: static; height: auto; padding: 16px; }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .nav h6 { display: none; }
        .lateral .rodape-lateral { display: none; }
  .principal { padding-inline: 16px; }
  .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
  .abertura { padding: 26px 22px; }
  .abertura .marca-grande { font-size: 36px; }
  h1 { font-size: 28px; }
}
@media (max-width: 520px) { .g4, .g5, .g6 { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: no-preference) { .tela-nova { animation: entra .18s ease-out; } }
@keyframes entra { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>

<div class="app">
  <aside class="lateral">
    <div class="logo" aria-label="EULER">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="8" y="6" width="2.4" height="20" rx="0.4" fill="#ECECEC"/><rect x="8" y="6" width="16" height="2.4" rx="0.4" fill="#ECECEC"/><rect x="12.6" y="14.8" width="9.4" height="2.4" rx="0.4" fill="#ECECEC"/><rect x="8" y="23.6" width="16" height="2.4" rx="0.4" fill="#ECECEC"/></svg>
      <span>EULER</span>
    </div>
    <nav class="nav" id="nav" aria-label="Telas"></nav>
    <div class="nome-lateral" id="nome-lateral" hidden><label for="autor">Seu nome (vai para o histórico)</label><input type="text" id="autor" placeholder="obrigatório para registrar" autocomplete="name"></div>
    <div class="rodape-lateral" id="rodape-lateral"></div>
  </aside>
  <main class="principal">
    <div class="conteudo">
      <div class="faixa-previa" id="faixa-previa"></div>
      <div id="tela"></div>
      <div class="rodape" id="rodape"></div>
    </div>
  </main>
</div>
<div class="dica" id="dica" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
const D = JSON.parse(document.getElementById("dados").textContent);
const estado = { tela: "inicio", ato: "1", r0: D.padrao[0], r: D.padrao[1], a: D.padrao[2], b: D.padrao[3],
  serie: null, diasAno: null, filtro: new Set(["Erro", "Atenção", "Informação"]), gerado: new Set() };
// os dois atos têm os mesmos registros de operação (D62): mesmos períodos e séries
const A = () => D.atos[estado.ato];
const N = D.atos["1"].periodos.length;
const SERIES = Object.keys(D.atos["1"].series);
estado.serie = SERIES[0];
const NOME_ATO = { "1": "Ato 1 · caso completo", "2": "Ato 2 · dados insuficientes" };

const e = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (v, casas) => v.toLocaleString("pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas });
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const chave = () => `${estado.r0}-${estado.r}|${estado.a}-${estado.b}`;
const combo = () => A().combos[chave()];
const selo = (cor, texto) => `<span class="selo s-${cor}">${e(texto)}</span>`;

const ICONES = {

  calculadora: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/>',
  seta: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  busca: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>',
  mao: '<path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11V5a1.5 1.5 0 0 1 3 0v6M14 11V6.5a1.5 1.5 0 0 1 3 0V14c0 4-2.5 7-6.5 7-2.6 0-4-1.2-5.6-3.6L3.2 14a1.5 1.5 0 0 1 2.4-1.7L8 15"/>',
  ok: '<circle cx="12" cy="12" r="9"/><path d="m8 12.2 2.8 2.8L16 9.5"/>',
  bloqueio: '<circle cx="12" cy="12" r="9"/><path d="M5.7 5.7 18.3 18.3"/>',
  ciencia: '<path d="M9 3h6M10 3v6l-5.6 9.8A1.5 1.5 0 0 0 5.7 21h12.6a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/><path d="M7.5 15h9"/>',
  cima: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  financeiro: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6.5 9.5h.01M17.5 14.5h.01"/>',
  oportunidades: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',

function cabecalho(sobre, titulo, resumo, comDados = true) {
  return `<header class="cabecalho">${sobre ? `<div class="sobrelinha">${e(sobre)}</div>` : ""}
    <h1>${e(titulo)}</h1>${resumo ? `<p class="resumo">${resumo}</p>` : ""}</header>
    ${comDados ? `<div class="dados-em-uso"><b>Análise temporária</b> · dados desta sessão: <b>${e(A().rotulo_dados)}</b> ${selo("orange", "DADOS SINTÉTICOS")}</div>` : ""}`;
}
const proximo = (tela, rotulo) => `<div class="proximo"><button class="botao" data-ir="${tela}">Próximo: ${e(rotulo)} ${icone("seta")}</button></div>`;
const metrica = (rotulo, valor, extra = "") => `<div class="cartao metrica"><div class="rotulo">${e(rotulo)}</div><div class="valor">${e(valor)}</div>${extra}</div>`;
function tabela(cab, linhas, numericas = []) {
  const th = cab.map((c, i) => `<th class="${numericas.includes(i) ? "num" : ""}">${e(c)}</th>`).join("");
  const tr = linhas.map((l) => `<tr>${l.map((v, i) => `<td class="${numericas.includes(i) ? "num" : ""}">${v}</td>`).join("")}</tr>`).join("");
  return `<div class="tabela-rolagem"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}

function periodosHtml() {
  const p = A().periodos;
  const opt = (de, ate, sel, rot) => Array.from({ length: ate - de + 1 }, (_, k) => de + k).map((i) => `<option value="${i}" ${i === sel ? "selected" : ""}>${rot(i)}</option>`).join("");
  const celulas = p.map((x, i) => {
    const classe = i >= estado.r0 && i <= estado.r ? "ref" : i >= estado.a && i <= estado.b ? "comp" : "";
    return `<button class="celula ${classe}" data-celula="${i}" title="${e(x.ini)} a ${e(x.fim)}${i > estado.r ? " · clique para comparar só esta semana" : ""}">${e(x.ini)}</button>`;
  }).join("");
  const dias = (de, ate) => Math.round((new Date(p[ate].fim_iso) - new Date(p[de].ini_iso)) / 864e5);
  const atalhos = [["Semanas 5–6 (padrão)", 0, 3, 4, 5], ["Semana 7 · sem medidor de vapor", 0, 3, 6, 6], ["Semana 8 · depois da limpeza", 0, 3, 7, 7], ["Antes × depois da limpeza (intervenção)", 4, 5, 7, 7]];
  return `<div class="cartao"><b>Períodos comparados</b>
    <div class="controles">
      <div class="controle">Período de referência (como era)<div class="linha">de <select id="ref-ini" aria-label="Início da referência">${opt(0, N - 2, estado.r0, (i) => p[i].ini)}</select> até <select id="ref-fim" aria-label="Fim da referência">${opt(estado.r0, N - 2, estado.r, (i) => p[i].fim)}</select></div></div>
      <div class="controle">Período de comparação (como ficou)<div class="linha">de <select id="comp-ini" aria-label="Início da comparação">${opt(estado.r + 1, N - 1, estado.a, (i) => p[i].ini)}</select> até <select id="comp-fim" aria-label="Fim da comparação">${opt(estado.a, N - 1, estado.b, (i) => p[i].fim)}</select></div></div>
    </div>
    <div class="tempo">${celulas}</div>
    <div class="legenda-tempo"><span><span class="q ref"></span><b>Referência</b> · ${e(p[estado.r0].ini)} a ${e(p[estado.r].fim)} · ${plural(dias(estado.r0, estado.r), "dia", "dias")}</span><span><span class="q comp"></span><b>Comparação</b> · ${e(p[estado.a].ini)} a ${e(p[estado.b].fim)} · ${plural(dias(estado.a, estado.b), "dia", "dias")}</span></div>
    <div class="atalhos"><span class="legenda">Atalhos:</span>${atalhos.map(([t, r0, r, a, b]) => `<button class="chip" data-atalho="${r0},${r},${a},${b}" aria-pressed="${estado.r0 === r0 && estado.r === r && estado.a === a && estado.b === b}">${e(t)}</button>`).join("")}</div>
  </div>`;
}

}
const seloDeteccao = (p) => (p ? `${selo(p[0], p[1])}${p[2] ? " " + e(p[2]) : ""}` : "—");

/* ------------------------------------------------------------------ gráficos */
function passoBonito(amplitude, alvo = 4) {
  const bruto = amplitude / alvo, pot = Math.pow(10, Math.floor(Math.log10(bruto)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * pot >= bruto) return m * pot;
  return 10 * pot;
}
const dataBR = (d) => `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;

function graficoSerie(s) {
  const W = 760, H = 270, m = { l: 44, r: 12, t: 12, b: 26 };
  const pts = s.pontos.map(([d, v]) => [new Date(d + "T00:00"), v]);
  const x0 = +pts[0][0], x1 = +pts[pts.length - 1][0];
  const vals = pts.map((p) => p[1]);
  const amp = Math.max(Math.max(...vals) - Math.min(...vals), 1);
  const lo = Math.min(...vals) - amp * 0.08, hi = Math.max(...vals) + amp * 0.3;
  const X = (t) => m.l + ((t - x0) / (x1 - x0)) * (W - m.l - m.r);
  const Y = (v) => m.t + ((hi - v) / (hi - lo)) * (H - m.t - m.b);
  const p = A().periodos;
  const faixa = (de, ate, cor, rot) => {
    const a = Math.max(X(+new Date(p[de].ini_iso)), m.l), b = Math.min(X(+new Date(p[ate].fim_iso)), W - m.r);
    return `<rect x="${a}" y="${m.t}" width="${Math.max(b - a, 0)}" height="${H - m.t - m.b}" fill="${cor}"/><text x="${a + 5}" y="${m.t + 14}" fill="#BDBDBD" font-size="12">${rot}</text>`;
  };
  const passo = passoBonito(hi - lo);
  let grade = "";
  for (let v = Math.ceil(lo / passo) * passo; v <= hi; v += passo) grade += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#333333"/><text x="${m.l - 7}" y="${Y(v) + 4}" text-anchor="end" fill="#A3A3A3" font-size="12">${nf(v, passo < 1 ? 1 : 0)}</text>`;
  let marcas = "";
  const primeiro = new Date(x0); primeiro.setDate(primeiro.getDate() + ((7 - primeiro.getDay()) % 7 || 7));
  for (let d = new Date(primeiro); +d <= x1; d.setDate(d.getDate() + 7)) marcas += `<text x="${X(+d)}" y="${H - 6}" text-anchor="middle" fill="#A3A3A3" font-size="12">${dataBR(d)}</text>`;
  const linha = pts.map(([d, v], i) => `${i ? "L" : "M"}${X(+d).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const pontos = pts.map(([d, v]) => `<circle cx="${X(+d).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6" fill="var(--serie)"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${e(s.titulo)}" data-serie-grafico>
    ${faixa(estado.r0, estado.r, "#2A3646", "Referência")}${faixa(estado.a, estado.b, "#45321F", "Comparação")}
    ${grade}${marcas}<path d="${linha}" fill="none" stroke="var(--serie)" stroke-width="2"/>${pontos}
    <line id="cursor" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="#8A8A8A" stroke-dasharray="3 3" visibility="hidden"/>
    <circle id="cursor-ponto" r="4.5" fill="var(--serie)" stroke="#212121" stroke-width="2" visibility="hidden"/>
    <rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" data-area="${m.l},${W - m.r}"/></svg>`;
}

function graficoSaude(sd) {
  const W = 760, H = 280, m = { l: 50, r: 14, t: 12, b: 26 };
  const p = A().periodos;
  const x0 = +new Date(p[0].ini_iso), x1 = +new Date(p[N - 1].fim_iso);
  const X = (t) => m.l + ((t - x0) / (x1 - x0)) * (W - m.l - m.r);
  const com = sd.periodos.map((x, i) => ({ ...x, i })).filter((x) => x.valor !== null);
  const extremos = com.flatMap((x) => (x.u === null ? [x.valor] : [x.valor - x.u, x.valor + x.u]));
  const mn = Math.min(...extremos), mx = Math.max(...extremos), amp = Math.max(mx - mn, 0.01);
  const lo = mn - 0.25 * amp, hi = mx + 0.35 * amp;
  const Y = (v) => m.t + ((hi - v) / (hi - lo)) * (H - m.t - m.b);
  const faixa = (de, ate, cor, rot) => {
    const a = X(+new Date(p[de].ini_iso)), b = X(+new Date(p[ate].fim_iso));
    return `<rect x="${a}" y="${m.t}" width="${b - a}" height="${H - m.t - m.b}" fill="${cor}"/><text x="${a + 5}" y="${m.t + 14}" fill="#BDBDBD" font-size="12">${rot}</text>`;
  };
  const passo = passoBonito(hi - lo), ordem = Math.floor(Math.log10(passo));
  const casas = Math.max(0, -ordem + ((passo / Math.pow(10, ordem)) % 1 ? 1 : 0));
  let grade = "";
  for (let v = Math.ceil(lo / passo) * passo; v <= hi; v += passo) grade += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#333333"/><text x="${m.l - 7}" y="${Y(v) + 4}" text-anchor="end" fill="#A3A3A3" font-size="12">${nf(v, casas)}</text>`;
  let marcas = "";
  const primeiro = new Date(x0); primeiro.setHours(0, 0, 0, 0); primeiro.setDate(primeiro.getDate() + ((7 - primeiro.getDay()) % 7 || 7));
  for (let d = new Date(primeiro); +d <= x1; d.setDate(d.getDate() + 7)) marcas += `<text x="${X(+d)}" y="${H - 6}" text-anchor="middle" fill="#A3A3A3" font-size="12">${dataBR(d)}</text>`;
  const ref = sd.valor_ref === null ? "" : `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(sd.valor_ref)}" y2="${Y(sd.valor_ref)}" stroke="#A3A3A3" stroke-dasharray="2 2"/>`;
  // eventos do mesmo dia ficam no mesmo lugar do eixo: um rótulo só ("3 · 4")
  const dias = [];
  sd.eventos.forEach((ev, k) => {
    const g = dias.find((d) => d.dia === ev.dia);
    if (g) { g.n.push(k + 1); g.txt.push(`${ev.quando} · ${ev.tipo}: ${ev.descricao}`); }
    else dias.push({ dia: ev.dia, t: +new Date(ev.iso), n: [k + 1], txt: [`${ev.quando} · ${ev.tipo}: ${ev.descricao}`] });
  });
  const eventos = dias.map((g) => `<line x1="${X(g.t)}" x2="${X(g.t)}" y1="${m.t}" y2="${H - m.b}" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="5 3"/><text x="${X(g.t) + 4}" y="${m.t + 34}" fill="#ECECEC" font-size="12" font-weight="700">${g.n.join(" · ")}</text><rect x="${X(g.t) - 6}" y="${m.t}" width="12" height="${H - m.t - m.b}" fill="transparent" data-dica="${e(g.txt.join(" | "))}"/>`).join("");
  const marcasPeriodo = com.map((x) => {
    const a = X(+new Date(p[x.i].ini_iso)), b = X(+new Date(p[x.i].fim_iso)), meio = (a + b) / 2;
    const barra = x.u === null ? "" : `<line x1="${meio}" x2="${meio}" y1="${Y(x.valor - x.u)}" y2="${Y(x.valor + x.u)}" stroke="var(--serie)" stroke-width="1.5" opacity=".8"/>`;
    return `<line x1="${a}" x2="${b}" y1="${Y(x.valor)}" y2="${Y(x.valor)}" stroke="var(--serie)" stroke-width="2"/>${barra}<circle cx="${meio}" cy="${Y(x.valor)}" r="4.5" fill="var(--serie)" stroke="#262626" stroke-width="2" data-dica="${e(`${p[x.i].ini} a ${p[x.i].fim} · ${x.texto} t/t · ${x.situacao[1]}`)}"/>`;
  }).join("");
  const faixas = (sd.ref ? faixa(sd.ref[0], sd.ref[1], "#2A3646", "Referência") : "") + (sd.mudanca ? faixa(sd.mudanca[0], sd.mudanca[1], "#45321F", "Mudança") : "");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Combustível por tonelada de vapor, período a período">${faixas}${grade}${marcas}${ref}${eventos}${marcasPeriodo}</svg>`;
}

function graficoSemanal() {
  const x = A().extrato, W = 760, H = 290, m = { l: 44, r: 34, t: 34, b: 28 };
  const linhas = x.semanal.map(([f, s, u, n]) => ({ f, d: new Date(s + "T00:00"), u, n }));
  const datas = linhas.map((l) => +l.d), us = linhas.map((l) => l.u);
  const x0 = Math.min(...datas), x1 = Math.max(...datas);
  const lo = Math.min(...us) - 0.02, hi = Math.max(...us) + 0.02;
  const X = (t) => m.l + ((t - x0) / (x1 - x0)) * (W - m.l - m.r);
  const Y = (v) => m.t + ((hi - v) / (hi - lo)) * (H - m.t - m.b);
  let grade = "";
  for (let v = Math.ceil(lo / 0.05) * 0.05; v <= hi; v += 0.05) grade += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#333333"/><text x="${m.l - 7}" y="${Y(v) + 4}" text-anchor="end" fill="#A3A3A3" font-size="12">${nf(v * 100, 0)}%</text>`;
  const semanas = [...new Set(datas)].sort((a, b) => a - b);
  const marcas = semanas.slice(1).map((t) => `<text x="${X(t)}" y="${H - 8}" text-anchor="middle" fill="#A3A3A3" font-size="12">${dataBR(new Date(t))}</text>`).join("");
  const fs = Object.keys(x.cores).filter((f) => linhas.some((l) => l.f === f));
  const legenda = fs.map((f, i) => `<circle cx="${m.l + 6 + i * 64}" cy="12" r="5" fill="${x.cores[f]}"/><text x="${m.l + 15 + i * 64}" y="16" fill="#A3A3A3" font-size="13">${e(f)}</text>`).join("");
  const series = fs.map((f) => {
    const l = linhas.filter((k) => k.f === f).sort((a, b) => a.d - b.d);
    const path = l.map((k, i) => `${i ? "L" : "M"}${X(+k.d).toFixed(1)},${Y(k.u).toFixed(1)}`).join("");
    const ult = l[l.length - 1];
    return `<path d="${path}" fill="none" stroke="${x.cores[f]}" stroke-width="2"/>`
      + l.map((k) => `<circle cx="${X(+k.d).toFixed(1)}" cy="${Y(k.u).toFixed(1)}" r="4" fill="${x.cores[f]}" stroke="#262626" stroke-width="2" data-dica="${e(f)} · semana de ${dataBR(k.d)} · ${nf(k.u * 100, 1)}% · ${plural(k.n, "lote", "lotes")}"/>`).join("")
      + `<text x="${X(+ult.d) + 8}" y="${Y(ult.u) + 4}" fill="#BDBDBD" font-size="12">${e(f)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Umidade média por semana e fornecedor">${legenda}${grade}${marcas}${series}</svg>`;
}

  }).join("");
  // nome de quem registra: só nas telas que gravam algo, como no app
  document.getElementById("nome-lateral").hidden = !ACOMP.includes(estado.tela);
  const campo = document.getElementById("autor");
  if (document.activeElement !== campo) campo.value = ac.autor || "";
}
const RENDER = { inicio: telaInicio, importar: telaImportar, saude: telaSaude, limites: telaLimites, investigacao: telaInvestigacao, financeiro: telaFinanceiro, oportunidades: telaOportunidades, extrato: telaExtrato, relatorio: telaRelatorio, painel: telaPainel, atualizar: telaAtualizar, fechamentos: telaFechamentos, acoes: telaAcoes, plantas: telaPlantas, publicos: telaPublicos, diagnostico: telaDiagnostico, calculadora: telaCalculadora };

function faixaPrevia() {
  document.getElementById("faixa-previa").innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center"><span><b>Prévia interativa</b> do app EULER com o caso de demonstração <b>sintético</b>. Os números são os calculados pelo motor da EULER (versão ${e(D.versao)}); nada é recalculado nesta página. O que você registrar (dados, fechamentos e ações) fica guardado só neste navegador.</span>
    <span class="atalhos"><span>Dados:</span>${["1", "2"].map((a) => `<button class="chip" data-ato="${a}" aria-pressed="${estado.ato === a}">${e(NOME_ATO[a])}</button>`).join("")}</span></div>`;
}

function abasDaSecao() { // telas irmãs da seção aberta, como no app
  const { telas } = secaoDe(estado.tela);
  if (telas.length < 2) return "";
  return `<nav class="abas-secao" aria-label="Telas desta seção">${telas.map((t) => `<button data-ir="${t.id}" ${t.id === estado.tela ? 'aria-current="page"' : ""}>${icone(t.icone)}${e(t.titulo)}</button>`).join("")}</nav>`;
}

let ultimaTela = null;
function mostrar(rolarParaTopo = false) {
  montarNav();
  faixaPrevia();
  const tela = document.getElementById("tela");
  // as seções recolhidas que a pessoa abriu continuam abertas quando a mesma tela é redesenhada
  const abertas = estado.tela === ultimaTela
    ? new Set([...tela.querySelectorAll("details[open] > summary")].map((s) => s.textContent)) : new Set();
  tela.innerHTML = `<div class="conteudo tela-nova">${abasDaSecao()}${RENDER[estado.tela]()}</div>`;
  tela.querySelectorAll("details > summary").forEach((s) => { if (abertas.has(s.textContent)) s.parentElement.open = true; });
  ultimaTela = estado.tela;
  if (rolarParaTopo) window.scrollTo({ top: 0 });
  ligarGraficoSerie();
}

function ir(tela) {
  estado.tela = tela;
  ac.erro = null;
  ac.abriu = null;
  try { history.replaceState(null, "", "#" + tela); } catch (_) { /* sem histórico na prévia */ }
  mostrar(true);
}

function ajustarComparacao() {
  if (estado.r < estado.r0) estado.r = estado.r0;
  if (estado.a <= estado.r) estado.a = estado.r + 1;
  if (estado.b < estado.a) estado.b = estado.a;
}

document.addEventListener("click", (ev) => {
  const alvo = ev.target.closest("[data-acao]");
  if (!alvo || alvo.disabled) return;
  ev.preventDefault();
  ACOES[alvo.dataset.acao]?.(alvo);
});
document.addEventListener("submit", (ev) => {
  const form = ev.target.closest("form[data-form]");
  if (!form) return;
  ev.preventDefault();
  FORMS[form.dataset.form]?.(form);
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "autor") { ac.autor = ev.target.value; guardar(); }
});
document.addEventListener("click", (ev) => {
  const alvo = ev.target.closest("[data-ato],[data-investigar],[data-ir],[data-serie],[data-atalho],[data-celula],[data-filtro],#gerar");
  if (!alvo) return;
  if (alvo.dataset.ato) { estado.ato = alvo.dataset.ato; return alvo.dataset.ir ? ir(alvo.dataset.ir) : mostrar(); }
  if (alvo.dataset.investigar) {
    // "Investigar esta mudança": a referência e os períodos da mudança, já escolhidos (D65)
    const sd = A().saude;
    [estado.r0, estado.r, estado.a, estado.b] = [sd.ref[0], sd.ref[1], sd.mudanca[0], sd.mudanca[1]];
    return ir("investigacao");
  }
  if (alvo.dataset.ir) return ir(alvo.dataset.ir);
  if (alvo.dataset.serie) { estado.serie = alvo.dataset.serie; return mostrar(); }
  if (alvo.dataset.atalho) { [estado.r0, estado.r, estado.a, estado.b] = alvo.dataset.atalho.split(",").map(Number); return mostrar(); }
  if (alvo.dataset.celula) { const i = +alvo.dataset.celula; if (i > estado.r) { estado.a = estado.b = i; mostrar(); } return; }
  if (alvo.dataset.filtro) { const g = alvo.dataset.filtro; estado.filtro.has(g) ? estado.filtro.delete(g) : estado.filtro.add(g); return mostrar(); }
  if (alvo.id === "gerar") { estado.gerado.add(estado.ato + ":" + chave()); return mostrar(); }
});
document.addEventListener("change", (ev) => {
  const id = ev.target.id;
  if (id === "ver-fech") { ac.fechSel = Number(ev.target.value); ac.abriu = null; guardar(); return mostrar(); }
  if (id === "inv-sel") { ac.invSel = Number(ev.target.value); ac.erro = null; guardar(); return mostrar(); }
  if (id === "pub-un") { estado.pubUn = ev.target.value; return mostrar(); }
  if (id === "diag-un") { estado.diagUn = ev.target.value; estado.diagMes = 0; return mostrar(); }
  if (id === "diag-mes") { estado.diagMes = Number(ev.target.value); return mostrar(); }
  if (id === "dias-ano") { const v = Number(ev.target.value); estado.diasAno = v >= 1 && v <= 366 ? v : null; return mostrar(); }
  if (id === "ref-ini") estado.r0 = +ev.target.value;
  else if (id === "ref-fim") estado.r = +ev.target.value;
  else if (id === "comp-ini") estado.a = +ev.target.value;
  else if (id === "comp-fim") estado.b = +ev.target.value;
  else return;
  ajustarComparacao();
  mostrar();
});

const dica = document.getElementById("dica");
function mostrarDica(texto, x, y) {
  dica.textContent = texto; dica.hidden = false;
  const w = dica.offsetWidth;
  dica.style.left = Math.min(x + 14, window.innerWidth - w - 8) + "px";
  dica.style.top = y + 14 + "px";
}
document.addEventListener("mousemove", (ev) => {
  const el = ev.target.closest("[data-dica]");
  if (el) mostrarDica(el.dataset.dica, ev.clientX, ev.clientY);
  else if (!ev.target.closest("[data-area]")) dica.hidden = true;
});

function ligarGraficoSerie() {
  const svg = document.querySelector("[data-serie-grafico]");
  if (!svg) return;
  const area = svg.querySelector("[data-area]");
  const s = A().series[estado.serie];
  const pts = s.pontos.map(([d, v]) => [new Date(d + "T00:00"), v]);
  const [xa, xb] = area.dataset.area.split(",").map(Number);
  const cursor = svg.querySelector("#cursor"), ponto = svg.querySelector("#cursor-ponto");
  const circulos = [...svg.querySelectorAll("circle")].filter((c) => c !== ponto);
  area.addEventListener("mousemove", (ev) => {
    const r = svg.getBoundingClientRect();
    const xv = ((ev.clientX - r.left) / r.width) * 760;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round(((xv - xa) / (xb - xa)) * (pts.length - 1))));
    const c = circulos[i];
    cursor.setAttribute("x1", c.getAttribute("cx")); cursor.setAttribute("x2", c.getAttribute("cx"));
    ponto.setAttribute("cx", c.getAttribute("cx")); ponto.setAttribute("cy", c.getAttribute("cy"));
    cursor.setAttribute("visibility", "visible"); ponto.setAttribute("visibility", "visible");
    const d = pts[i][0];
    mostrarDica(`${dataBR(d)}/${d.getFullYear()} · ${nf(pts[i][1], s.casas)} ${s.unidade}`, ev.clientX, ev.clientY);
  });
  area.addEventListener("mouseleave", () => { cursor.setAttribute("visibility", "hidden"); ponto.setAttribute("visibility", "hidden"); dica.hidden = true; });
}

document.getElementById("rodape").textContent = D.textos.rodape;
document.getElementById("rodape-lateral").textContent = "EULER · prévia interativa · dados sintéticos em uso";
const inicial = (location.hash || "").slice(1);
if (RENDER[inicial]) estado.tela = inicial;
mostrar();
</script>
